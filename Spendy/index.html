<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

</head>
<body>
       <div class="dashboard-container">
        <header>
            <h4>Overview</h4>
            <h3>Dashboard</h3>
        </header>
        <section class="stats-section">
            <div class="stat forTotalBalance">
                <header>
                    <p>Total Balance</p>
                    <button class="stats-img-btn"><img class="stats-img" src="icons/money.png" alt=""></button>
                </header>
                  <h5 class="balance-amount"></h5>
            </div>
            <div class="stat forTotalIncome">
                <header>
                    <p>Total Income</p>
                    <button class="stats-img-btn"><img class="stats-img" src="icons/income.png" alt=""></button>
                </header>
                <h5 class="Income-amount"></h5>
            </div>
            <div class="stat forTotalExpense">
                    <header>
                        <p>Total Expenses</p>
                        <button class="stats-img-btn"><img class="stats-img" src="icons/expenses.png" alt=""></button>
                    </header>
                    <h5 class="Expense-amount"></h5>
            </div>
        </section>

        <section class="recents-Container">
     
        </section>
       </div>
      
<p class="add-transaction hide"></p>
<p class="overlay hide"></p>
<p class="income-button hide"></p>
<p class="Expense-button hide"></p>
<p class="add hide"></p>
<p class="close-button hide"></p>
<p class="cl-btn hide"></p>
<p class="okay-btn"></p>
<p class="transaction-container hide"></p>
<script src="script.js"></script>
</body>
</html>
