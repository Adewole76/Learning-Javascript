<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendy</title>
    <link rel="stylesheet" href="transactions.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
</head>
<body>
    <button class="add-transaction">add transaction</button>
     <div class="overlay hidden"></div>

    <form class="transaction-form hidden" action="">
        <h2>Add a transaction</h2>
        <button type="button" class="close-button">close</button>
        <section>
        <button type="button" class="income-button">Income</button>
       <button type="button" class="Expense-button">Expense</button>
      </section>
    <!--<label for="browser-choice">Transaction type:</label>-->
<label for="amount">Amount:
    <input class="amount-input" type="number" placeholder="amount" required>
</label>

<label for="">Description:
    <input class="description-input" type="text" placeholder="description" required>
</label>
<label class="Income-category hidden" for="">Category:
    <select name="" class="incomeCat" required>
        <option value="Allowance">Allowance</option>
        <option value="Salary">Salary</option>
        <option value="Gift">Gift</option>
        <option value="Refund">Refund</option>
        <option value="Others">Others</option>
    </select>
</label>
<label class="Expense-cate" for="">Category:
    <select name="" class="ExpenseCat category-select" >
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Data/Airtime">Data/Airtime</option>
        <option value="Books/Stationery">Books/Stationery</option>
        <option value="Rent">Rent</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Clothing">Clothing</option>
        <option value="Others">Others</option>
    </select>
</label>
<button type="button" class="add">Add Transaction</button>
</form>
    <main class="transaction-container">

</main>
<div class="Insufficient-balance-modal hidden">
<header>    
<h3>Insufficient Balance</h3>
<button class="cl-btn"><img class="close-btn" src="icons/close.png" alt=""></button>
</header>
<footer>
<p class="error-info">Your current balance is too low to cover
this expense. Try reducing the expense amount
 or add funds to your account before proceeding</p>
 <button class="okay-btn">Okay</button>
</footer>
</div>
<p class="total-balances hidden"></p>
<p class="actual-transactions hidden"></p>
<script src="script.js"></script>
</body>
</html>
