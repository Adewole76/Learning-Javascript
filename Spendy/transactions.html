<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendy</title>
    <link rel="stylesheet" href="transactions.css">
</head>
<body>
    <button class="add-transaction">add transaction</button>
     <div class="overlay hidden"></div>

    <form class="transaction-form hidden" action="">
        <h2>Add a transaction</h2>
        <section>
        <button class="income-button">Income</button>
       <button class="Expense-button">Expense</button>
      </section>
    <!--<label for="browser-choice">Transaction type:</label>-->
<label for="">Amount:
    <input type="text" placeholder="amount">
</label>

<label for="">Description:
    <input type="text" placeholder="description">
</label>
<label for="Income Category">Category:
    <select name="" id="">
        <option value="">Allowance</option>
        <option value="">Salary</option>
        <option value="">Gift</option>
        <option value="">Refund</option>
        <option value="">Others</option>
    </select>
</label>
<label class="Expense Category" for="">Category:
    <select name="" id="">
        <option value="">Food</option>
        <option value="">Transport</option>
        <option value="">Date/Airtime</option>
        <option value="">Books/Stationery</option>
        <option value="">Rent</option>
        <option value="">Entertainment</option>
        <option value="">Clothing</option>
        <option value="">Others</option>
    </select>
</label>
</form>
    <main class="transaction-container">

</main>

<script src="script.js"></script>
</body>
</html>
