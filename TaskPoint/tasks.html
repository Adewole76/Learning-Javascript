<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TaskPoint</title>
</head>
<body>
    <nav class="ribbon">
        <h1 class="main-header">TaskPoint</h1>
        <button class="hamburger hidden">Menu</button>
    </nav>
    <section class="sidebar">
        <ul>
            <a href="index.html"><li class="dashboard-link">Dashboard</li></a>
            <a href="tasks.html"><li class="taskBoard-link">Tasks</li></a>
        </ul>
    </section>
    <section class="mobile-sidebar">
        <button class="close-sidebar">close</button>
        <ul>
            <li class="dashboard-link">Dashboard</li>
            <li class="TasksBoard-link">Tasks</li>
        </ul>
    </section>
    <div class="overLay hidden"></div>
    <header class="add-task-section">
    <input class="add-task-input" type="text" placeholder="what would you like to do?">
    <button class="add-task-btn">add Task</button>
</header>
<section class="filters-section">
    <footer>
    <h3 class="filter-heading">Filters</h3>
    <button class="todo-filter" >Todo</button>
    <button class="Inprogress-filter">In progress</button>
    <button class="Done-filter">Completed</button>
    <button class="remove-filter">Remove filters</button>
</footer>
</section>
<main class="task-container">
    <p style="display: none" class="Total-tasks-div"></p>
</main>


    <script src="script.js"></script>

</body>
</html>
